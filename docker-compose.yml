services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_ENABLE_OPERATOR_CONSOLE: ${VITE_ENABLE_OPERATOR_CONSOLE:-false}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      PORT: 8080
      API_TARGET: ${API_TARGET:-http://docmesh-doc:8000}
      API_PREFIX: ${API_PREFIX:-/api}
      ALLOW_OPERATOR_ROUTES: ${ALLOW_OPERATOR_ROUTES:-false}
      FORWARD_TRUSTED_CONTEXT_HEADERS: ${FORWARD_TRUSTED_CONTEXT_HEADERS:-false}
    depends_on:
      docmesh-doc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  docmesh-doc:
    image: ${DOCMESH_IMAGE:-ghcr.io/kyundae-kim/docmesh-doc:v0.7.0}
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DMS_METADATA_BACKEND: ${DMS_METADATA_BACKEND:-sqlite}
      SQLITE_PATH: ${SQLITE_PATH:-/data/docmesh.sqlite3}
      DMS_APPLICATION_USER_ID: ${DMS_APPLICATION_USER_ID:-docmesh-doc}
      DMS_MAX_FILE_SIZE: ${DMS_MAX_FILE_SIZE:-104857600}
      ROOT_PATH: ${ROOT_PATH:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_REGION: ${MINIO_REGION:-}
    volumes:
      - docmesh-data:/data
    depends_on:
      minio-init:
        condition: service_completed_successfully
      docmesh-data-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/readiness', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z-cpuv1
    restart: unless-stopped
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"

  docmesh-data-init:
    image: alpine:3.20
    restart: "no"
    user: "0:0"
    volumes:
      - docmesh-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - chown -R 10001:10001 /data

volumes:
  docmesh-data:
  minio-data:
